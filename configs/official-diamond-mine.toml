[server]
name = "AoS Revival Diamond Mine"  # <= 31 chars (retail MAX_SERVER_NAME_SIZE)
port = 27029
max_players = 24
tick_rate = 60

[game]
default_mode = "dia"
default_map = "ArcticBase"
movement_authority = "server"

[lobby]
match_length_minutes = 15
map_rotation = [
    "AncientEgypt", "ArcticBase", "Atlantis", "BlockNess", "BranCastle",
    "CastleWars", "DoubleDragon", "DragonIsland", "Frontier", "GreatWall",
    "London", "LunarBase", "MayanJungle", "SpookyMansion",
    "TheColosseum", "TokyoNeon",
]

[bots]
enabled = true
population_mode = "backfill"
fill_target = 6
max_bots = 6
reserve_human_slots = 2
difficulty = "mixed"
perception_hz = 8
decision_hz = 8
path_requests_per_second = 24
main_thread_budget_ms = 1.5
worker = "process"
clean_slate_games = 3

[revival]
enabled = false

[steam]
enabled = false
steam_port = 8773
query_port = 27030

[logging]
level = "INFO"
file = "official-diamond-mine.log"
console = false

[game_rules]
RULE_SPAWN_PROTECTION_TIME = "3"   # OFF, 1, 2, 3 s; ends early when the player attacks
