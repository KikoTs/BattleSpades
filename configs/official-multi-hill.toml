map_rotation = [
    "AncientEgypt", "Atlantis", "BlockNess", "BranCastle", "CastleWars",
    "DoubleDragon", "DragonIsland", "Frontier", "GreatWall", "Invasion",
    "London", "LunarBase", "MayanJungle", "SpookyMansion",
    "TheColosseum",
]

