[server]
name = "AoS Revival Official Demolition"
port = 27031
max_players = 24
tick_rate = 60

[game]
default_mode = "dem"
default_map = "Atlantis"
movement_authority = "server"

[lobby]
match_length_minutes = 15
# Retail demolition.txt also names GreatWall, but playlists.PlayList skips
# it (mapinfo invalid_modes has "dem"), so retail never served it.
map_rotation = [
    "Atlantis", "BlockNess", "CastleWars", "DoubleDragon", "DragonIsland",
    "Frontier", "LunarBase", "TokyoNeon",
]

[bots]
enabled = true
population_mode = "backfill"
fill_target = 6
max_bots = 6
reserve_human_slots = 2
difficulty = "mixed"
perception_hz = 8
decision_hz = 8
path_requests_per_second = 24
main_thread_budget_ms = 1.5
worker = "process"
clean_slate_games = 3

[revival]
enabled = false

[steam]
enabled = false
steam_port = 8774
query_port = 27032

[logging]
level = "INFO"
file = "official-demolition.log"
console = false

[game_rules]
RULE_SPAWN_PROTECTION_TIME = "3"   # OFF, 1, 2, 3 s; ends early when the player attacks
