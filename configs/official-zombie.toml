[server]
name = "AoS Revival Official Zombie"
port = 27021
max_players = 24
tick_rate = 60

[game]
default_mode = "zom"
default_map = "SpookyMansion"
movement_authority = "server"

[lobby]
match_length_minutes = 10
map_rotation = [
    "AncientEgypt", "ArcticBase", "Atlantis", "BlockNess", "BranCastle",
    "CastleWars", "DoubleDragon", "DragonIsland", "Frontier", "GreatWall",
    "Invasion", "London", "MayanJungle", "SpookyMansion", "TheColosseum",
    "TokyoNeon",
]

[bots]
enabled = true
population_mode = "backfill"
fill_target = 6
max_bots = 6
reserve_human_slots = 2
difficulty = "mixed"
perception_hz = 8
decision_hz = 8
path_requests_per_second = 24
main_thread_budget_ms = 1.5
worker = "process"
clean_slate_games = 3

[revival]
enabled = false

[steam]
enabled = false
steam_port = 8769
query_port = 27022

[logging]
level = "INFO"
file = "official-zombie.log"
console = false
