# Official BattleSpades Hardcore variant. Normal objective rules and maps.
# Class kits and Hardcore switches are selected by the mode code itself.
[server]
name = "BattleSpades Hardcore TDM"
port = 27015
max_players = 24
password = ""

[game]
default_mode = "hc_tdm"
default_map = "ArcticBase"
maps_path = "maps"

[bots]
enabled = true
population_mode = "backfill"
fill_target = 25
max_bots = 25
difficulty = "normal"

[steam]
enabled = false

[revival]
enabled = false

[game_rules]
RULE_ENABLE_GRAVESTONES = false
RULE_ENABLE_CORPSE_EXPLOSION = false
RULE_POINTS_FROM_TEABAGGING = true

[admin]
password = ""

[lobby]
map_rotation = []
