[bots]
# Bot decisions and bounded direct-VXL pathfinding run outside gameplay.
# "thread" uses less memory for one casual instance; "process" isolates a
# native/pathfinding worker fault and is used by every shipped fleet profile.
# The authoritative 60 Hz server applies validated, expiring intentions.
enabled = true
population_mode = "backfill"
fill_target = 12
max_bots = 12
reserve_human_slots = 2
difficulty = "mixed"
worker = "thread"
perception_hz = 10
decision_hz = 8
path_requests_per_second = 24
# Beta tactical squads; set "classic" to retain the previous behavior layer.
behavior_version = "cooperative"
friendly_mischief = true
# Occasional short bot chat lines after kills/deaths (hard rate limited).
# Off by default; set true to bring the banter back.
chatter = false
# Label shown before every bot's name ("[BOT]Pancake") so stock and native
# clients can tell bots from people. Humans cannot use it. Printable ASCII,
# at most 6 characters; "" turns the label off.
name_prefix = "[BOT]"
main_thread_budget_ms = 0.75
seed = 0
debug_visualization = false
# Purge all per-game bot state every round; additionally recycle the isolated
# planner after this many completed game/map boundaries. Zero disables recycle.
clean_slate_games = 3
# Per-team bot skill balance: when one team's humans clearly out-kill the
# other side, ease that team's bots and sharpen the others. Profile fields
# shift by at most skill_balance_max_shift (0..0.9), moving skill_balance_rate
# per second, ignoring edges inside skill_balance_deadband (0..0.95) and teams
# with fewer than skill_balance_min_events kills+deaths.
skill_balance = true
skill_balance_max_shift = 0.35
skill_balance_rate = 0.03
skill_balance_deadband = 0.15
skill_balance_min_events = 6

# Per-gamemode rules. Each [modes.<code>] table overrides that mode's
# built-in defaults (server/mode_data.py). Omit a key to keep the default.
#   score_limit  — win threshold (TDM: team kills; CTF: intel captures)
#   time_limit   — round length in seconds (0 = no clock)
[modes.tdm]
time_limit = 900       # 15-minute round clock
kill_points = 1        # team points per kill
headshot_bonus = 0     # retail: every enemy kill is one team point

[modes.ctf]
time_limit = 1800      # shipped CTF clock (30 minutes)

[modes.cctf]
time_limit = 5400      # shipped Classic CTF clock (90 minutes)
score_limit = 5        # shipped Match Lobby target (intel captures)
intel_auto_return = false
shoot_with_intel = true

[modes.vip]
time_limit = 900       # 15-minute full-match clock
selection_delay = 10.0 # retail delay before one boss per team is selected
round_intermission = 7.0

[modes.zom]
time_limit = 600
infection_delay = 60.0 # retail ZOM_TIME_BEFORE_FIRST_INFECTION
minimum_players = 2
zombie_respawn_time = 0.0

# The five objective modes below (Multi-Hill, Territory Control, Diamond Mine,
# Demolition, Occupation) are fully playable: each runs its objective state
# machine, scoring and win conditions (docs/GAMEPLAY.md). Their score targets
# and timings come from the retail Match Lobby rules ([game_rules] RULE_*)
# and server/mode_data.py; only the round clock is overridden here.
[modes.mh]
time_limit = 1500

[modes.tc]
time_limit = 1500

[modes.dia]
time_limit = 900
# A diamond that is dropped or thrown (primary fire) into an open drop-off
# scores for the team that carried it: "Diamond cashed in for your team!".
loose_cash_in = true
# Diamonds are never placed on the map: digging uncovers them, by chance
# (retail: 1 in 100 mined blocks at best). While no diamond is in play, the
# block that brings the count since the last find to this number always
# uncovers one. 0 = chance only, as in retail.
discovery_guarantee_blocks = 300

[modes.dem]
time_limit = 900

[modes.oc]
time_limit = 900

[teams]
# Team names are STRING-TABLE IDS the client localizes (TEAM1_COLOR -> "Blue"),
# NOT literal text — literals render as "Missing string <name>" in-game.
team1_name = "TEAM1_COLOR"
team1_color = [44, 117, 179]  # retail AoS blue; pure RGB makes HUD/blocks glow
team2_name = "TEAM2_COLOR"
team2_color = [137, 179, 44]   # retail AoS green
auto_balance = true
balance_threshold = 2
# Mid-match drift repair (auto_balance must be on), checked every
# balance_check_interval seconds. A lead must last balance_grace_seconds; then
# a dead bot switches sides, after balance_bot_wait_seconds a bot is retired
# and replaced, and last a dead human is moved (never twice within
# balance_player_cooldown seconds). Zombie/Tutorial/UGC are never balanced.
balance_mid_match = true
balance_grace_seconds = 5.0
balance_player_cooldown = 600.0
balance_bot_wait_seconds = 10.0
balance_check_interval = 1.0

[objectives]
# Escape watch: players outside the playable map get the retail high-minimap
# marker so the enemy can hunt them. Checked every escape_watch_interval
# seconds; above the map top for escape_watch_sky_seconds, inside solid
# terrain for escape_watch_embedded_seconds, or (objective carriers, VIPs,
# survivors, zone holders only) sealed in a tiny pocket for
# escape_watch_entomb_seconds.
escape_watch_enabled = true
escape_watch_interval = 1.0
escape_watch_sky_seconds = 5
escape_watch_embedded_seconds = 3
escape_watch_entomb_seconds = 5
# A ground intel/diamond/bomb buried, sealed or left floating this long is
# returned home or resettled onto the surface.
objective_entomb_seconds = 5
# Objective pickups need a clear line of sight (no grabbing through walls).
objective_pickup_requires_los = true
# Picking up an objective ends the carrier's spawn protection.
objective_pickup_ends_spawn_protection = true
# Idle players do not count toward holding a TC/MH zone after this many
# seconds without input; 0 disables.
objective_afk_seconds = 60
# CTF: a carrier in an open-sky pit dug up to this many blocks below its own
# base still scores, so defenders cannot excavate captures away.
ctf_base_pit_depth = 24

# [weapons] rifle_damage / smg_damage / shotgun_damage / spade_damage /
# grenade_damage were removed: damage comes from the retail per-weapon and
# per-body-part tables (server/weapons_retail.py, docs/WEAPONS_RETAIL.md).
# Old configs that still set them load, but the values are ignored and a
# warning is logged.

[world]
default_skybox = "User_Grassland.txt" # fallback for maps without a sidecar
maps_path = "maps"
prefabs_path = "prefabs"
# Informational only: every retail VXL is 512x512x240 and the map loader
# never reads these. A different value is ignored with a warning.
map_size_x = 512
map_size_y = 512
map_size_z = 240
# water_level / water_damage were removed: the water plane is fixed by the
# retail VXL format (z 238/239) and retail has no water damage.
fog_color_rgb = [12, 13, 11] # fallback; authored map metadata wins
entities_wire_ready = true

[plugins]
# Plugins are trusted local Python code. Public top-level *.py files containing
# a BasePlugin subclass are discovered at startup. Empty allowlist = all;
# denylist always wins. Values may be a filename stem or BasePlugin.name.
enabled = true
path = "plugins"
allowlist = []
denylist = []

[anticheat]
# Checks that could reject legit play under packet loss start log-only;
# watch the "anticheat" log lines for a session, then set enforce_* = true.
enforce_shot_origin = false
shot_origin_tolerance = 1.5
enforce_aim_direction = false
aim_direction_tolerance_deg = 10.0
enforce_input_starvation = false
starvation_airborne_ticks = 24
starvation_timeout_seconds = 8.0
enforce_input_backlog = false
backlog_max_frames = 6
# Client frame cadence plus a bounded server-time budget tolerates bunched
# reliable packets. Missing this key in older configs retains log-only mode.
enforce_block_interval = true
kick_on_protocol_violation = true   # NaN/forged packets the stock client never sends
admin_login_attempts = 3
summary_interval_seconds = 60.0
# Statistical suspicion report: evaluated every summary_interval_seconds,
# written as JSON lines to report_path (rotated at report_max_bytes, keeping
# report_backups). It only flags players (score >= flag_min_score); it never
# kicks. Review with /acreport and /acstats. Thresholds per signal:
report_enabled = true
report_path = "logs/anticheat.jsonl"
report_max_bytes = 5000000
report_backups = 3
flag_min_score = 1.0
headshot_kill_ratio = 0.60       # headshot share of hitscan kills (0..1)
headshot_kill_min_kills = 30
headshot_hit_ratio = 0.55        # headshot share of single-ray hits (0..1)
headshot_hit_min_hits = 60
accuracy_min_shots = 100         # per-weapon accuracy vs the human population
accuracy_min_population = 20
accuracy_percentile = 99.0       # 0..100
accuracy_min_margin = 0.15
snap_min_deg = 20.0              # aim snaps onto a head within snap_frames
snap_frames = 2
snap_head_radius = 0.35
snap_margin_deg = 0.75
snap_min_events = 4
snap_min_engaged = 20
snap_ratio = 0.10
reaction_acquire_deg = 10.0      # acquisition (reaction) time
reaction_history_frames = 60
reaction_min_samples = 15
reaction_median_ms = 90.0
reaction_reengage_seconds = 3.0
engage_cone_deg = 4.0
pellet_seed_min_shots = 64       # shotgun pellet-seed skew
pellet_seed_top_share = 0.2
sustained_min_minutes = 5.0      # sustained log-only violations
sustained_min_count = 20
sustained_per_minute = 3.0

[audio]
# In-round music bed: a looping last_man_standing_00N track at every round
# start and for joiners. A DELIBERATE DEVIATION kept on request: retail rounds
# were silent (map ambience only) until the final 61 s (game_ending_00N), and
# last_man_standing played only for the Zombie last survivor. false = retail.
mode_start_music = true

[updates]
# Read the shared update manifest at startup and log "new server version X
# available". Nothing is ever installed automatically; run
# `BattleSpades --update` to download, verify and stage a new server.
update_check_enabled = true
update_manifest_url = "https://www.aosplay.net/updates/stable.json"

[conduct]
# Team griefing: grief points per 100 HP removed from teammates plus a bonus
# per team kill -- including a teammate's death from a deployable YOU set off
# (shooting their landmine). One point decays every grief_decay_seconds; one
# burst (a single grenade into a crowd) is capped at grief_incident_max_points
# so an accident alone never kicks. Private warning, then ERROR_KICK_GRIEFING.
grief_kick_enabled = true
grief_kick_points = 10.0
grief_warn_points = 5.0
grief_decay_seconds = 60.0
grief_team_kill_points = 3.0
grief_team_damage_points = 1.0
grief_incident_seconds = 3.0
grief_incident_max_points = 6.0
grief_exempt_admins = true
# AFK: only real input (keys/aim) counts; the clock pauses while loading,
# dead, or between rounds. Warn at afk_warn_seconds, kick (ERROR_AFK_TIMEOUT)
# at afk_kick_seconds; 0 disables. Spectators get their own limit (0 = exempt).
# Not retail: retail only had the ERROR_AFK_TIMEOUT kick code; these times
# and the warning are this server's choices.
afk_kick_seconds = 600
afk_warn_seconds = 540
afk_spectator_kick_seconds = 1800
afk_exempt_admins = true
announce_kicks = true
# Extra reserved names on top of Server/Admin/Console/System/Moderator/...
reserved_names = []

# The 77 retail Steam achievements, evaluated by this server on every match
# (docs/ACHIEVEMENTS.md). Deliberately no official/ranked gate: a local
# Create Match server unlocks them too. An unlock is saved, then announced to
# everyone as "<player> has unlocked the "<name>" achievement".
[achievements]
enabled = true
count_bot_kills = true      # kills OF bots count; bots never earn achievements
# Preserve this database across upgrades; it holds every player's progress.
path = "state/achievements.sqlite3"

[admin]
# In-game `/admin <password>` login. It is DISABLED (and startup logs a
# WARNING) while this is the shipped "changeme", empty, or shorter than 12
# characters -- set a unique secret before exposing the server. Three wrong
# guesses from one address ([anticheat] admin_login_attempts) kick the player
# and ban the address for 10 minutes. The container entrypoint takes it from
# BATTLESPADES_ADMIN_PASSWORD instead.
password = "changeme"
log_commands = true
bans_path = "bans.json"
# One-time room-creator secret. Rooms started by the BattleSpades client
# (Create Match, Map Creator, Steam/relay hosting) get a fresh random token
# and admin password in their private session config; the client redeems the
# token with /claimhost right after joining. Leave empty on dedicated servers.
creator_token = ""
# Verified identities that become admin on join, no password needed:
# "steam:<SteamID64>" (Steam P2P relay or an AoSPlay ticket) or
# "aosplay:<account id>". Player names are never trusted.
auto_admin = []

[logging]
level = "INFO"
file = "server.log"
console = true
packet_trace = false
queue_capacity = 8192
# File I/O stays on the listener thread and rotates before one host can fill
# its disk. Up to backup_count historical files are retained.
max_bytes = 16777216
backup_count = 3
suppress_packets = [2, 4, 11, 56, 57]  # Packet IDs to hide in debug logs (2 = WorldUpdate, 4 = ClientData, 11 = SetColor)

[debug]
# One-frame retail button chronology currently used by production. Validation
# can override this with --movement-input-latch 0 for controlled A/B runs.
movement_input_latch_frames = 1
# Retail ClientData is unsequenced on the wire and the client labels every
# update contiguously, so a gap of up to this many labels is lost input: the
# server refills each missing frame with the held input, one per tick, instead
# of trailing the client by a frame for the rest of the round
# (docs/RETAIL_INPUT_LOSS.md). Must stay below the client's clock-jump
# threshold of 10; 0 disables the refill.
input_gap_fill_limit = 8
# Reverse-engineering capture is intentionally OFF in production. It owns a
# localhost UDP transport and writes large physics snapshots when enabled.
debug_parity = false
debug_parity_host = "127.0.0.1"
debug_parity_port = 32895
debug_parity_queue_capacity = 256
debug_parity_sample_hz = 10.0
debug_parity_flush_interval = 1.0
debug_parity_flush_batch = 128
# A/B test: false = no WorldUpdate broadcasts (pure client-side prediction,
# no corrections). If walking is smooth with false and chunky with true,
# the jank is in the WorldUpdate/correction loop.
broadcast_world_updates = true
# Retail WorldUpdate cadence: 2 ticks at 60 Hz = 30 Hz observer replication.
worldupdate_broadcast_interval = 2
# Local-player rows are required. Without a fresh self row, the compiled client
# keeps its CreatePlayer network_position at spawn; pressing jump can then run
# its correction path against that stale anchor and visibly roll the player back
# even when the native SNAP/ADJUST counters stay quiet.
worldupdate_include_self = true
# (Only used when worldupdate_include_self = true.) Constant added to the
# per-recipient self-row stamp = player.last_applied_input_loop (the consumed
# input's loop_count). Stock ClientData buttons use the observed-frame latch,
# while native yaw capture shows orientation already belongs to the current
# movement-history label. Keep the stamp itself unshifted.
worldupdate_loop_offset = 0
# Refresh the local correction anchor with every 30 Hz WorldUpdate. Wider
# intervals reduced soft correction chatter but intermittently let jump reuse a
# stale anchor and visibly roll back.
worldupdate_self_row_interval = 2
# Preserve BattleSpades' existing airborne owner cadence (10 Hz).
worldupdate_airborne_self_row_interval = 6
# Retail-only freshness workaround (30 Hz). Stock Character restores its
# cached owner position on jump launch; the native client has no such reset.
# This changes owner delivery, not physics, observers or flight transitions.
worldupdate_retail_airborne_self_row_interval = 2
# Retail never acknowledges applying the jetpack-active WorldUpdate. Give the
# owner this many accepted input frames of quiet transition time, then publish
# one causal active-flight checkpoint and repeat. This bounds long Glide
# Jetpack drift below the hard-snap range while observers and authoritative
# hitboxes continue receiving the server snapshot at 30 Hz.
jetpack_owner_handoff_input_frames = 30
# Exhaustion can leave SPACE held while the owner falls. Resume after release,
# settle, and ground contact; this cap prevents an indefinite local-row holdoff.
jetpack_owner_release_handoff_input_frames = 600
# Pack thrust boundaries the owner cannot acknowledge: the simulation starts
# thrust N accepted-input frames after announcing activation and keeps it N
# frames after announcing exhaustion, matching when the retail client's
# WorldUpdate row with the active bit lands (calibrated live 2026-09-24 with
# the Rocketeer jump-pack gate; see docs/RETAIL_JUMP_RESTORE.md).
jetpack_activation_defer_frames = 2
jetpack_exhaustion_tail_frames = 3
# Those two values are the handoff on a link with no delay. When true they are
# extended by the input labels already received and by the owner's round trip,
# which a real link adds before the row lands (retail owners only; the native
# client predicts the boundary itself). false = the fixed values above.
jetpack_handoff_latency_aware = true
# Log every self-row's (stamp, position) to logs/selfrow_samples.ndjson so the
# offline simulator (tmp/reconcile_sim.py) can replicate the client's exact
# reconciliation and report the snap/adjust/no-op distribution. Turn ON for one
# 12s walk to deterministically calibrate worldupdate_loop_offset on a given
# client, then OFF for normal play.
debug_selfrow = false
movement_debug_capture = false
# Client clock margin knob. MEASURED: +1 is silently ignored by the client
# (under its resync threshold) ??? keep 0; determinism comes from
# INPUT_DELAY_TICKS=1 in server/player.py instead.
clock_sync_loop_bias = 0
