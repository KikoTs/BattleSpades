# BattleSpades Server Configuration
# Protocol 1.0 Battle Builders

[server]
name = "BattleSpades Server"
port = 27015
max_players = 24 # stock Match Lobby maximum; dedicated protocol accepts 1..255
tick_rate = 60  # MUST match client ~60fps loop; 120 broke jump (loop_count 2x-rate desync)
steam_id = 90087911866072064 # stable uint64 identity for non-Steam hosting
# Private welcome after loading, once per connection. Omitted settings use the
# Beta 0.1/AoS Revival defaults. Tokens: {player}, {release}, {build_date}.
# Custom MOTD replaces the default lines; empty greeting and [] disable both.
# join_greeting = "Welcome, {player}! {release} | Build (UTC): {build_date}"
# motd = ["Build big. Play fair. Have fun!"]
# Private server: players must type this before anything is sent to them.
# Empty = open server. At most 64 bytes. Works with the BattleSpades client
# only; the original retail client has no working password prompt.
password = ""
password_max_attempts = 3       # wrong answers before the kick
password_timeout_seconds = 60.0 # time to answer the prompt
password_lockout_seconds = 60.0 # that address is refused this long after the kick

# Used only by run_map_creator.py / BattleSpadesMapCreator.exe.
# `project` reopens an existing .ugc/.vxl/.txt triplet or names a new one.
# Relative project/output/retail paths are resolved beside the executable.
# `terrain` is used only when creating a project; it never silently replaces
# an existing map. CLI flags override these values, and --overwrite is
# intentionally CLI-only.
[map_creator]
project = "MyUGCMap"
output_dir = "ugc-projects"
# Alternative to output_dir for client-launched authoring. Set exactly one of
# them: publish_root is the client's `hosted_ugc` directory, and maps are saved
# into its `maps/` child so the stock Publish Map screen discovers them.
publish_root = ""
terrain = ""          # blank = grassland for new maps; or desert/lunar/mountain/grassland/temple/urban/marsh/snowy/water
target_mode = ""      # blank = preserve existing / tdm for new; or tdm/ctf/dem/mh/oc/tc/vip/zom/dia
retail_root = ""      # blank = auto-discover; otherwise AoS directory containing ugc/maps and ugc/kv6

# Optional registration in the original retail Steam server browser. The
# supplied Valve runtime must be 32-bit; BattleSpades runs it in an isolated
# helper so a DLL/backend failure cannot stall gameplay. Proprietary DLLs are
# intentionally not bundled. Put steam_api.dll in ./steam-runtime; compatible
# Steam client libraries are auto-discovered or selected with steamclient_dir.
[steam]
enabled = false                   # opt in when the original x86 Steam runtime is installed
app_id = 224540              # fixed Ace of Spades app; 480 is Spacewar
runtime_dir = ""             # empty = ./steam-runtime or env override
steamclient_dir = ""         # empty = auto-detect the installed Steam folder
helper_path = ""             # empty = bundled Windows x86 helper
# Safe default: use Steam's installed client runtime. The old steamclient.dll
# supplied with decompiled builds can block forever in SteamGameServer_Init.
use_supplied_steamclient = false
steam_port = 8766            # original master/updater UDP port
query_port = 0               # 0 = server.port + 1; must be separately forwarded
public = true                # false selects LAN/no-master mode
secure = false               # true requests VAC mode; false is public insecure
region = ""                  # optional retail region filter value
game_version = "1.0.0.0"     # exact original wrapper version
protocol_version = 168       # emitted as the retail v168 browser tag
playlist_id = 8
texture_skin = ""            # blank auto-selects mafia skin for Mafia/VIP
require_registration = false # true makes startup fail if Steam cannot log on
startup_timeout_seconds = 8.0
publish_interval_seconds = 1.0

# Revival web registry, launcher identity, and persistent leaderboard bridge.
# Set AOS_MASTER_WRITE_TOKEN in the server process environment to the same
# secret configured on Vercel. Never place that secret in this file.
[revival]
enabled = true
base_url = "https://www.aosplay.net"
public_host = "127.0.0.1"   # replace with the public DNS name or IPv4 address
server_id = ""              # blank = public_host:server.port
region = "europe"
official = false
require_identity = false    # true rejects legacy/unranked clients
heartbeat_interval_seconds = 30.0
request_timeout_seconds = 5.0
# Preserve this database across upgrades; pending results retry with their original IDs.
results_path = "state/round-results.sqlite3"
# Status file written by the Linux Steam sidecar (--status-file); registers its
# SteamID with the AoSPlay list. Blank = none. Also AOS_STEAM_SIDECAR_STATUS.
steam_sidecar_status = ""

# Steam relay hosting: players join through Steam's relay network instead of
# the server's IP address, which helps where a provider blocks that address
# (and costs nothing elsewhere: Steam connects directly when it can). Runs the
# bundled steam-host/battlespades-steam-host beside the server. Windows needs
# the Steam client installed; Linux needs Valve's steamclient.so from SteamCMD
# (in ~/.steam/sdk64/ or runtime_dir). See deploy/steam-linux/README.md.
[steam_host]
enabled = false
executable = ""             # blank = the bundled helper
# One helper per Steam application: Ace of Spades owners (224540) and players
# without the game, who attach as Spacewar (480).
app_ids = [224540, 480]
# Optional game server login token for 224540, from
# https://steamcommunity.com/dev/managegameservers (one per running server).
# It keeps the SteamID across restarts; blank logs on anonymously.
# The file holds the token on one line. Also AOS_STEAM_GSLT_FILE.
token_file = ""
runtime_dir = ""            # Linux: directory holding steamclient.so
max_clients = 64

[network]
max_connections = 64
# timeout_ms / bandwidth_limit were removed: retail and this server keep the
# ENet library defaults (0/0 bandwidth, default peer timeout).
# Refuse clients whose ENet connect data is not protocol 168 (retail and
# native both send 168) with the retail CLIENT/SERVER_OUT_OF_DATE reason.
require_protocol_version = true
event_budget = 512
max_pending_packets = 4096
packet_drain_budget = 4096
plugin_event_budget_ms = 2.0
max_map_mutation_journal = 8192
# Post-join re-send of every destroyed cell since map load. The MapSync stream
# already carries every edited column (live-verified: 0 mismatches over 1310
# probed cells, docs/MAP_SYNC_JOIN.md), so this stays off; it made joiners
# watch dug terrain "sync" after spawning.
map_air_catchup_enabled = false
# Reassert this many pre-existing destroyed cells per joining ClientData while
# that catch-up is enabled. The player remains gameplay-gated meanwhile.
map_air_catchup_batch_limit = 256
entity_tick_batch_limit = 8192
mode_event_queue_limit = 8192
mode_event_drain_budget = 512
# Client block edits commit after the matching movement frame, never during
# tick-start packet draining. These caps keep malicious/flooded edits bounded.
world_mutation_queue_limit = 2048
world_mutation_batch_limit = 256
world_mutation_cell_budget = 4096
world_mutation_timeout_ticks = 180
# Prefabs reserve their stock immediately and commit after physics. A
# competitive prefab commits whole in one tick so the client shows it at once;
# prefab_competitive_cell_budget caps those cells per tick across all players
# (whole prefabs beyond it wait a tick, never split). UGC editor models drain
# prefab_cell_batch_limit cells per tick.
prefab_queue_limit = 32
prefab_cell_batch_limit = 16
prefab_competitive_cell_budget = 2048
# Maximum already-decoded prefab cells checked for world contact per tick.
# UGC model decoding/rotation is off-thread; this keeps validation bounded.
prefab_validation_batch_limit = 1024
# Damaged-block/prefab health rows per reliable BlockManager-state packet
# sent to a joiner (1..4096).
prefab_health_state_batch = 128
# Lag compensation: hitscan/melee hits are checked against target hitboxes
# where the shooter saw them, one round trip (+ lag_compensation_view_delay_ms,
# 0..250) ago, never more than RTT + lag_compensation_extra_ms (0..250) or
# lag_compensation_max_ms (0..1000). The retail client extrapolates remote
# players, so view delay 0 is the measured contract (docs/LAG_COMPENSATION.md).
lag_compensation_enabled = true
lag_compensation_max_ms = 250
lag_compensation_extra_ms = 50
lag_compensation_view_delay_ms = 0
# A shot whose datagram was lost arrives one retransmission late; its own
# (unsequenced) ClientData dates it and adds up to this much rewind (0..1000).
lag_compensation_late_shot_ms = 400
# WorldUpdate transport. "split" sends other players, entities and turrets
# unsequenced, so one lost reliable packet no longer freezes every remote
# player until it is retransmitted; each player's own row stays ordered.
# "sequenced" is the previous single ordered packet.
worldupdate_delivery = "split"
# Space a player's unsequenced snapshots wider than the reordering measured on
# that player's link, so a stale snapshot is never applied over a newer one.
worldupdate_reorder_guard = true
# Delayed canonical reassertion of rejected or cancelled client predictions.
# Successful ordinary builds/prefabs/digs are not replayed because that would
# run native placement/damage particles twice. Unsupported collapses are the
# exception: each client derives the fallen component locally, so the server
# later confirms its exact air cells with non-cascading type-6 Damage packets.
terrain_repair_enabled = true
terrain_repair_queue_limit = 8192
terrain_repair_batch_limit = 8
terrain_repair_interval_ticks = 3
terrain_repair_delay_ticks = 120
# Collapse confirmations start after 0.3 seconds at 60 Hz. Eight cells every
# three ticks bounds reliable traffic while clearing the visible shell first.
terrain_collapse_repair_batch_limit = 8
terrain_collapse_repair_delay_ticks = 18
# Let MapEnded(52) move retail clients into the terminal/reconnect scene before
# the old ENet session closes with MATCH_ENDED(18).
transition_grace_seconds = 1.25

[game]
same_team_collision = false
default_mode = "tdm"
# Server-side dev AI players (0 = none). Bots fight autonomously (TDM
# kill->score->respawn). The old "client crashes rendering non-local
# players" was an IDENTITY bug (StateData.player_id was always 0) — fixed
# 2026-07-06 via per-connection id reservation; bots are safe for live play.
bot_count = 0
default_map = "MayanJungle"
# "client" = echo client-reported positions (fallback while physics parity work
# is in progress); "server" = authoritative server simulation (the server's
# physics engine is oracle-calibrated to match the client's compiled engine).
movement_authority = "server"
# How a joining client gets the map.
#   "full" - always send the complete map. Verified live on every client.
#   "auto" - the retail fast join: a client whose own copy of the map has the
#            same CRC loads that copy and receives only the columns changed
#            since the map started; every other client gets the complete map.
# Keep "full" for now. The retail client code supports "auto", but the one
# live retail join on it (2026-06-12) ended in a hollow world and has not
# been repeated; "auto" is tested at protocol level only.
map_sync_mode = "full"
friendly_fire = false
fall_damage = true
build_damage = true
# Radar packet 21 carries this value as a native visible countdown. The server
# removes the station on the same deadline, so team visibility cannot linger.
# Retail: 45 s (retail constant A1901; docs/RETAIL_VALUES.md).
radar_station_lifetime_seconds = 45.0

[lobby]
# Stock Match Lobby choices are 2,4,...24 players. Dedicated servers accept
# 1..255 through server.max_players; 24 is the retail-tested ceiling.
# Uncomment to replace every mode's native clock. Allowed values are exactly:
# 5,10,15,20,25,30,35,40,45,50,55,60,90. A [modes.<code>].time_limit wins.
# match_length_minutes = 15
# Empty uses the mode's retail playlist (playlists/<mode>.txt filtered like
# retail PlayList: mapinfo invalid_modes, classic/mafia flags, release; e.g.
# Territory Control = Alcatraz + CityOfChicago), falling back to every .vxl
# in world.maps_path. Otherwise this list is used for the F1/F2/F3 map vote;
# missing files are logged and skipped, and stock maps retail marks invalid
# for the mode (e.g. GreatWall in Demolition) are dropped with a warning.
map_rotation = []
# Retail shuffles the lobby's map list once (baseSquadLobbyMenu
# random.shuffle(map_list)); false keeps the listed order.
map_rotation_shuffle = true
# Offer maps whose retail mapinfo max_players is below the human count last.
map_vote_retail_max_players = true
# Full map rollovers hold the native scores/credits overlay for this many
# seconds after voting resolves, then send MapEnded and reload every retained
# peer. Same-map /restart never opens the terminal overlay.
end_screen_seconds = 12.0
# Retail end-of-round presentation on every round end (same-map restarts
# included): ShowTextMessage(73) sets the scoreboard headline ("{team}
# wins!", "Draw!", the Zombie/VIP/Occupation/Demolition variants) and
# ForceShowScores(72) holds the scoreboard open for end_screen_seconds,
# released when the next round starts. Both are plain HUD toggles.
end_round_scoreboard = true
end_round_headline = true
# Map-vote candidates: maps sized for the lobby come first (players times
# map_vote_area_per_player standable columns, never below map_vote_min_area;
# bots count as map_vote_bot_weight of a player, 0..1). The last
# map_vote_recent_exclude maps are offered last. Areas come from each map's
# .botnav cache; map_size_overrides pins a map to an area or a size class.
map_vote_size_fit = true
map_vote_area_per_player = 8000
map_vote_min_area = 24000
map_vote_recent_exclude = 2
map_vote_bot_weight = 1.0
map_size_overrides = {}   # e.g. { WW1 = "large", DragonIsland = 27000 }
# Constructs a map adds to every class (all but the zombies and the Classic
# Soldier), after the class's own constructs. The game ships six map-themed
# constructs; these are the defaults. `map_prefabs = {}` offers none, which
# is what the original game's data lists. Shown by BattleSpades clients.
map_prefabs = { London = ["prefab_london_taxi", "prefab_london_postbox", "prefab_london_duck"], LunarBase = ["prefab_lunarcargo", "prefab_lunarshield", "prefab_lunarsteps"] }
# Kick votes (K). Retail MIN_TIME_BETWEEN_KICK_VOTES 300 s and
# MIN_TIME_BETWEEN_CANCELLED_KICK_VOTES 45 s, per starter address; a starter
# needs votekick_min_team_players on their team (retail 3; 0 disables).
# Each refusal sends the stock KICK_DENIED_* message to the starter.
votekick_cooldown_seconds = 300.0
votekick_cancelled_cooldown_seconds = 45.0
votekick_min_team_players = 3

# Exact Match Lobby rule names recovered from gameRulesPanel.pyc. Values are
# validated at startup; unknown names and unsupported slider values are fatal
# configuration errors instead of silently producing client/server split-brain.
