RULE_ENABLE_SPECTATORS = true
RULE_ENABLE_FALL_ON_WATER_DAMAGE = true
RULE_RESPAWN_TIMES = 5                 # 0..60 in five-second steps; retail default 10 (deliberate BattleSpades pace)
RULE_BLOCK_HEALTH = "100%"             # 50%, 100%, 200%
RULE_WEAPON_DAMAGE = "100%"            # 50%, 100%, 200%
RULE_SPAWN_PROTECTION_TIME = "3"       # OFF, 1, 2, 3 seconds; ends early when the player attacks
