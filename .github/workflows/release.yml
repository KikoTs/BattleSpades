name: Build portable beta release

on:
  workflow_dispatch:
    inputs:
      retry_macos_release:
        description: "Recheck the two timing failures from beta.3's complete Intel Mac suite and package the unchanged tag"
        type: boolean
        default: false
  push:
    tags:
      - "v*-beta.*"
      - "v*-alpha.*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    if: ${{ !inputs.retry_macos_release }}
    name: Build ${{ matrix.platform }} ${{ matrix.architecture }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows
            architecture: x86_64
            python_architecture: x64
            runner: windows-2025
          - platform: windows
            architecture: arm64
            python_architecture: arm64
            runner: windows-11-arm
          - platform: linux
            architecture: x86_64
            python_architecture: x64
            runner: ubuntu-24.04
          - platform: linux
            architecture: arm64
            python_architecture: arm64
            runner: ubuntu-24.04-arm
          - platform: macos
            architecture: x86_64
            python_architecture: x64
            runner: macos-15-intel
          - platform: macos
            architecture: arm64
            python_architecture: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    # The Intel macOS runner needs about 85 minutes for the full suite alone.
    timeout-minutes: 150

    steps:
      - name: Check out release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.python_architecture }}
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: >-
          python -c "from pathlib import Path; import os, sys;
          version = Path('VERSION').read_text(encoding='utf-8').strip();
          expected_tag = f'v{version}'; actual_tag = os.environ['GITHUB_REF_NAME'];
          sys.exit(0 if actual_tag == expected_tag else
          f'tag {actual_tag!r} does not match {expected_tag!r}')"

      - name: Record native build environment
        run: >-
          python -c "import platform, struct, sys;
          print('python=' + sys.version.replace(chr(10), ' '));
          print('platform=' + platform.platform());
          print('machine=' + platform.machine());
          print('pointer_bits=' + str(struct.calcsize('P') * 8))"

      - name: Ensure Tk for the desktop host
        # BattleSpadesServer uses the Tk that setup-python's CPython links
        # against; PyInstaller then bundles it, so players install nothing.
        # This only installs the runtime library on a runner image lacking it.
        if: matrix.platform == 'linux'
        run: python -c "import tkinter" || (sudo apt-get update && sudo apt-get install -y libtk8.6)

      - name: Install pinned release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-release.txt

      - name: Compile native extensions
        run: python setup.py build_ext --inplace

      - name: Build isolated x86 Steam bridge
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          cmake -S tools/steam_bridge -B build/steam-bridge -A Win32
          if ($LASTEXITCODE -ne 0) { throw "Steam bridge configure failed" }
          cmake --build build/steam-bridge --config Release --parallel
          if ($LASTEXITCODE -ne 0) { throw "Steam bridge build failed" }

      - name: Build Steam relay host
        # Lets players join through Steam's relay network where the server's
        # address is blocked (tools/steam_host). Valve ships no Steamworks
        # library for Windows on Arm, and macOS has no dedicated-server Steam
        # runtime. Never fatal: the server ships without it if this fails.
        if: (matrix.platform == 'windows' && matrix.architecture == 'x86_64') || matrix.platform == 'linux'
        continue-on-error: true
        shell: bash
        run: |
          cmake -S tools/steam_host -B build/steam-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build/steam-host --config Release --parallel

      - name: Run complete source test suite
        run: python -m pytest tests -q

      - name: Freeze one-directory server
        # Invoke the module through setup-python's interpreter. A global
        # `pyinstaller` executable may belong to another Python installation.
        run: python -m PyInstaller --noconfirm --clean BattleSpades.spec

      - name: Stage and archive native release
        run: >-
          python scripts/package_release.py
          --frozen-dir dist/BattleSpades
          --output-root release-dist
          --platform ${{ matrix.platform }}
          --architecture ${{ matrix.architecture }}

      - name: Smoke packaged Windows launcher outside archive
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $bundle = Get-ChildItem -LiteralPath "$env:GITHUB_WORKSPACE\release-dist" -Directory | Select-Object -First 1
          if ($null -eq $bundle) { throw "staged release directory is missing" }
          Push-Location -LiteralPath $env:RUNNER_TEMP
          try {
            $sessionConfig = Join-Path $env:RUNNER_TEMP "battlespades-session.toml"
            Copy-Item -LiteralPath "$($bundle.FullName)\config.toml" -Destination $sessionConfig
            & "$($bundle.FullName)\BattleSpades.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "packaged --version failed" }
            & "$($bundle.FullName)\BattleSpades.exe" --check --config $sessionConfig
            if ($LASTEXITCODE -ne 0) { throw "packaged external-config check failed" }
            & "$($bundle.FullName)\BattleSpadesTutorial.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "tutorial --version failed" }
            & "$($bundle.FullName)\BattleSpadesTutorial.exe" --check --config $sessionConfig
            if ($LASTEXITCODE -ne 0) { throw "tutorial external-config check failed" }
            & "$($bundle.FullName)\BattleSpadesMapCreator.exe" --version
            if ($LASTEXITCODE -ne 0) { throw "map creator --version failed" }
            # Windowed executable: wait for it explicitly and read its exit code.
            $gui = Start-Process -FilePath "$($bundle.FullName)\BattleSpadesServer.exe" -ArgumentList "--self-check" -Wait -PassThru
            if ($gui.ExitCode -ne 0) { throw "server window --self-check failed" }
          } finally {
            Pop-Location
          }

      - name: Smoke packaged POSIX launcher outside archive
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          bundle="$(find "$GITHUB_WORKSPACE/release-dist" -mindepth 1 -maxdepth 1 -type d -name 'BattleSpades-*' -print -quit)"
          test -n "$bundle"
          cd "$RUNNER_TEMP"
          cp "$bundle/config.toml" "$RUNNER_TEMP/battlespades-session.toml"
          "$bundle/BattleSpades" --version
          "$bundle/BattleSpades" --check --config "$RUNNER_TEMP/battlespades-session.toml"
          "$bundle/BattleSpadesTutorial" --version
          "$bundle/BattleSpadesTutorial" --check --config "$RUNNER_TEMP/battlespades-session.toml"
          "$bundle/BattleSpadesMapCreator" --version
          "$bundle/BattleSpadesServer" --self-check

      - name: Upload native zip
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-${{ matrix.platform }}-${{ matrix.architecture }}
          path: release-dist/*.zip
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Publish prerelease
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out checksum tooling
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download all native archives
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Require complete matrix and write checksums
        run: python scripts/verify_release_assets.py --asset-dir release-assets --project-root .

      - name: Publish unsigned beta prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="$(python -c 'import runpy; print(runpy.run_path("server/build_info.py")["DISPLAY_RELEASE"])')"
          gh release create "$GITHUB_REF_NAME" \
            release-assets/*.zip release-assets/SHA256SUMS.txt \
            --verify-tag \
            --prerelease \
            --title "$title (${GITHUB_REF_NAME#v})" \
            --notes-file release/NOTES.md

  recheck-macos:
    name: Recheck beta.3 Intel Mac timing and package
    if: inputs.retry_macos_release
    runs-on: macos-15-intel
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - name: Check out the immutable release source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: v0.3.0-beta.3
          persist-credentials: false

      - name: Verify source and previous complete-suite evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(git rev-parse HEAD)" = 39a5b6ad183e13a51ac316afdf8ca0d2990bf761
          test "$(cat VERSION)" = 0.3.0-beta.3
          gh run view 39950504514 --attempt 2 --json headSha,jobs > previous-run.json
          gh run view 39950504514 --attempt 2 --log-failed > previous-failures.log
          python - <<'PY'
          import json, re
          from pathlib import Path
          run = json.loads(Path('previous-run.json').read_text())
          assert run['headSha'] == '39a5b6ad183e13a51ac316afdf8ca0d2990bf761'
          builds = [job for job in run['jobs'] if job['name'].startswith('Build ')]
          assert len(builds) == 6
          assert all(job['conclusion'] == ('failure' if job['name'] == 'Build macos x86_64' else 'success') for job in builds)
          log = Path('previous-failures.log').read_text()
          failed = set(re.findall(r'FAILED (tests/\S+)', log))
          assert failed == {
              'tests/test_map_load_stall.py::test_background_map_load_keeps_main_thread_responsive[MayanJungle]',
              'tests/test_map_load_stall.py::test_background_map_load_keeps_main_thread_responsive[ClassicImport]',
          }, failed
          assert '2 failed, 11832 passed, 16 skipped' in log
          print('Confirmed complete-suite evidence: 11832 passed; only two timing assertions need rechecking.')
          PY

      - name: Set up the same Python toolchain
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: "3.12"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-release.txt

      - name: Install pinned dependencies and compile native extensions
        run: |
          python -m pip install -r requirements-release.txt
          python setup.py build_ext --inplace

      - name: Diagnose loading versus disposal and runner scheduling
        run: |
          python - <<'PY'
          import asyncio, ctypes, json, statistics, time
          from pathlib import Path
          from server.config import ServerConfig
          import server.world_manager as module

          spans = []
          retained = []
          def instrument(owner, name):
              original = getattr(owner, name)
              def wrapped(*args, **kwargs):
                  started = time.perf_counter()
                  try:
                      return original(*args, **kwargs)
                  finally:
                      spans.append((name, started, time.perf_counter()))
              setattr(owner, name, wrapped)
          for name in ('VXL', 'load_map_metadata'):
              instrument(module, name)
          for name in ('prewarm_spawn_candidates', '_refresh_world'):
              instrument(module.WorldManager, name)

          def load(keep):
              config = ServerConfig()
              config.maps_path = str(Path.cwd() / 'maps')
              world = module.WorldManager(config)
              started = time.perf_counter()
              assert world.load_map('MayanJungle')
              spans.append(('load-total', started, time.perf_counter()))
              started = time.perf_counter()
              if keep:
                  retained.append(world)
              del world
              spans.append(('dispose', started, time.perf_counter()))

          async def measure(fn):
              spans.clear()
              gaps = []
              task = asyncio.create_task(asyncio.to_thread(fn))
              last = time.perf_counter()
              while not task.done():
                  await asyncio.sleep(0.001)
                  now = time.perf_counter()
                  gaps.append((now - last, last, now))
                  last = now
              await task
              worst, start, end = max(gaps)
              overlap = [(name, round(max(0, min(end,b)-max(start,a))*1000, 2))
                         for name,a,b in spans]
              return {'worst_ms':round(worst*1000,2),
                      'overlapping_stages':overlap,
                      'stages_ms':[(n,round((b-a)*1000,2)) for n,a,b in spans]}

          load(False)
          report = {}
          for label, fn in (
              ('idle', lambda: time.sleep(1)),
              ('load_and_dispose', lambda: load(False)),
              ('load_and_retain', lambda: load(True)),
              ('gil_held_control', lambda: ctypes.PyDLL(None).usleep(100_000)),
          ):
              results = []
              for _ in range(5):
                  results.append(asyncio.run(measure(fn)))
                  retained.clear()
              report[label] = results
              print(label, 'median_ms', statistics.median(r['worst_ms'] for r in results), flush=True)
              print(json.dumps(results), flush=True)
          Path('map-loading-diagnostic.json').write_text(json.dumps(report, indent=2))
          PY

      - name: Recheck original timing assertions and their negative control
        run: >-
          python -m pytest tests/test_map_load_stall.py
          -k 'responsiveness or background_map_load' -q -s -x --junitxml=recheck-results.xml

      - name: Freeze and package the tagged server
        run: |
          python -m PyInstaller --noconfirm --clean BattleSpades.spec
          python scripts/package_release.py --frozen-dir dist/BattleSpades --output-root release-dist --platform macos --architecture x86_64

      - name: Verify every packaged launcher outside the archive
        run: |
          bundle="$GITHUB_WORKSPACE/release-dist/BattleSpades-0.3.0-beta.3-macos-x86_64"
          cd "$RUNNER_TEMP"
          cp "$bundle/config.toml" "$RUNNER_TEMP/battlespades-session.toml"
          "$bundle/BattleSpades" --version
          "$bundle/BattleSpades" --check --config "$RUNNER_TEMP/battlespades-session.toml"
          "$bundle/BattleSpadesTutorial" --version
          "$bundle/BattleSpadesTutorial" --check --config "$RUNNER_TEMP/battlespades-session.toml"
          "$bundle/BattleSpadesMapCreator" --version
          "$bundle/BattleSpadesServer" --self-check

      - name: Upload the verified Intel Mac archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-macos-x86_64-recheck
          path: release-dist/*.zip
          if-no-files-found: error
          compression-level: 0

      - name: Retain complete-suite evidence and timing recheck results
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: intel-mac-release-validation
          path: |
            previous-run.json
            previous-failures.log
            recheck-results.xml
            map-loading-diagnostic.json
