name: Diagnose macOS map loading
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-release.txt
      - run: python -m pip install -r requirements-release.txt
      - run: python setup.py build_ext --inplace
      - run: python scripts/beta02_map_load_diagnostic.py
      - run: python -m pytest tests/test_map_load_stall.py -q -s
